<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyclopean — Submissions Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Courier+Prime:wght@400;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#d8d3c4;
  --paper-2:#cfc9b8;
  --stock:#c9c3b1;
  --ink:#191d18;
  --ink-2:#4a4f47;
  --ink-3:#7b7f74;
  --concrete:#3c4a3f;
  --concrete-2:#2c372f;
  --concrete-3:#212a23;
  --stamp:#8d3527;
  --stamp-soft:rgba(141,53,39,.12);
  --brass:#7a6a2f;
  --rule:#a9a291;
  --rule-2:#bcb5a3;
  --focus:#2f5d4a;
  --disp:'Archivo Black',system-ui,sans-serif;
  --form:'Courier Prime',ui-monospace,monospace;
  --body:'Public Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--body);
  background:var(--paper);
  color:var(--ink);
  font-size:15px;
  line-height:1.55;
  min-height:100vh;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9;opacity:.35;
  background-image:
    repeating-linear-gradient(0deg,rgba(25,29,24,.035) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(25,29,24,.02) 0 1px,transparent 1px 4px);
}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}

/* ============ masthead ============ */
.masthead{
  background:var(--concrete);
  color:var(--paper);
  border-bottom:3px solid var(--concrete-3);
  position:relative;z-index:10;
}
.mast-in{
  max-width:1500px;margin:0 auto;padding:14px 22px 12px;
  display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;
}
.mast-title{flex:1;min-width:250px}
.mast-title h1{
  font-family:var(--disp);font-size:clamp(19px,2.6vw,27px);
  letter-spacing:.02em;text-transform:uppercase;line-height:1;
  text-shadow:1.5px 1.5px 0 rgba(141,53,39,.55);
}
.mast-sub{
  font-family:var(--form);font-size:11px;color:#a8b2a4;
  margin-top:6px;letter-spacing:.04em;
}
.mast-form{
  font-family:var(--form);font-size:11px;color:#9aa596;
  text-align:right;line-height:1.7;
}
.mast-form b{color:var(--paper);font-weight:400}

/* identity + sync controls */
.mast-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who{
  display:flex;align-items:center;gap:0;
  border:1px solid rgba(216,211,196,.35);background:rgba(0,0,0,.18);
}
.who label{
  font-family:var(--form);font-size:10px;color:#9aa596;
  padding:0 8px;letter-spacing:.06em;border-right:1px solid rgba(216,211,196,.22);
}
.who input{
  background:none;border:0;color:var(--paper);font-family:var(--form);
  font-size:12px;padding:7px 9px;width:150px;
}
.who input::placeholder{color:#7d8879}
.who input:focus{outline:none;background:rgba(0,0,0,.25)}
.mini-btn{
  font-family:var(--form);font-size:10.5px;letter-spacing:.06em;
  border:1px solid rgba(216,211,196,.35);background:rgba(0,0,0,.18);
  color:#c5cdc0;padding:7px 11px;transition:background .12s,color .12s;
}
.mini-btn:hover{background:rgba(216,211,196,.14);color:var(--paper)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block;margin-right:6px;vertical-align:middle}
.sync-dot.live{background:#7fbf6a;box-shadow:0 0 6px rgba(127,191,106,.8)}
.sync-dot.err{background:#d0603f}

/* ============ tabs ============ */
.tabbar{
  background:var(--concrete-3);
  border-bottom:1px solid var(--rule);
  position:relative;z-index:10;
}
.tabbar-in{
  max-width:1500px;margin:0 auto;padding:0 22px;
  display:flex;align-items:stretch;gap:2px;
}
.tab{
  font-family:var(--form);font-size:12px;letter-spacing:.09em;
  text-transform:uppercase;color:#8e9a8b;
  padding:11px 20px 10px;border-bottom:3px solid transparent;
  transition:color .12s,background .12s;
}
.tab:hover{color:var(--paper);background:rgba(255,255,255,.05)}
.tab[aria-selected="true"]{
  background:var(--paper);color:var(--ink);border-bottom-color:var(--stamp);
}
.tab .ct{font-size:10.5px;color:var(--ink-3);margin-left:7px}
.tab[aria-selected="true"] .ct{color:var(--stamp)}

/* ============ shell ============ */
.shell{
  max-width:1500px;margin:0 auto;padding:0 22px 90px;
  display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:0;
  align-items:start;
}
@media(max-width:1080px){.shell{grid-template-columns:minmax(0,1fr)}}

/* ============ filter strip ============ */
.strip{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:13px 0 12px;border-bottom:1px solid var(--rule);
}
.search{
  flex:1;min-width:180px;display:flex;align-items:center;
  border:1px solid var(--rule);background:rgba(255,255,255,.32);
}
.search span{font-family:var(--form);font-size:10px;color:var(--ink-3);padding:0 9px;letter-spacing:.06em}
.search input{background:none;border:0;padding:8px 10px 8px 0;width:100%;font-size:14px}
.search input:focus{outline:none}
.chipset{display:flex;gap:0;border:1px solid var(--rule)}
.chip{
  font-family:var(--form);font-size:10.5px;letter-spacing:.05em;
  padding:7px 11px;color:var(--ink-2);background:rgba(255,255,255,.2);
  border-right:1px solid var(--rule);transition:background .12s;
}
.chip:last-child{border-right:0}
.chip:hover{background:rgba(255,255,255,.5)}
.chip[aria-pressed="true"]{background:var(--concrete);color:var(--paper)}

/* ============ tree ============ */
.register{padding:18px 26px 0 0;min-width:0}
@media(max-width:1080px){.register{padding-right:0}}

.node{position:relative}
.node-kids{position:relative;margin-left:19px;border-left:1px solid var(--rule-2)}
.node-kids::before{content:none}

.row{
  display:flex;align-items:flex-start;gap:10px;
  padding:9px 10px 9px 8px;
  border-bottom:1px solid rgba(169,162,145,.55);
  position:relative;transition:background .1s;
}
.row:hover{background:rgba(255,255,255,.4)}
.row.sel{background:rgba(255,255,255,.72);box-shadow:inset 3px 0 0 var(--stamp)}
.node-kids > .node > .row{padding-left:16px}
.node-kids > .node > .row::before{
  content:'';position:absolute;left:0;top:20px;width:9px;height:1px;background:var(--rule-2);
}
.row.dim{opacity:.34}

.twist{
  width:17px;height:17px;flex:0 0 17px;margin-top:3px;
  font-family:var(--form);font-size:10px;line-height:17px;text-align:center;
  color:var(--ink-2);transition:transform .12s;pointer-events:none;
}
.twist.leaf{visibility:hidden}
.twist.open{transform:rotate(90deg)}
.row.branch{cursor:pointer}

.pts{
  font-family:var(--form);font-size:10.5px;white-space:nowrap;flex:0 0 auto;
  margin-top:3px;color:var(--brass);font-weight:700;letter-spacing:.02em;
}
.pts.roll{color:var(--ink-3);font-weight:400}
.hasimg{
  font-family:var(--form);font-size:10px;color:var(--ink-3);
  border:1px solid var(--rule);padding:1px 5px;margin-top:3px;flex:0 0 auto;
}

/* card images */
.img-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.thumb{
  position:relative;width:84px;height:84px;border:1px solid var(--rule);
  background:rgba(255,255,255,.4);overflow:hidden;
}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.thumb-load{
  font-family:var(--form);font-size:10px;color:var(--ink-3);
  display:flex;align-items:center;justify-content:center;height:100%;
}
.thumb-x{
  position:absolute;top:2px;right:2px;width:19px;height:19px;
  background:rgba(33,42,35,.8);color:var(--paper);font-family:var(--form);
  font-size:10px;line-height:19px;text-align:center;opacity:0;transition:opacity .12s;
}
.thumb:hover .thumb-x{opacity:1}
.thumb-x:hover{background:var(--stamp)}
.img-empty{
  font-family:var(--form);font-size:11px;color:var(--ink-3);
  border:1px dashed var(--rule);padding:14px;text-align:center;width:100%;
}
.img-add{
  font-family:var(--form);font-size:10.5px;letter-spacing:.05em;
  border:1px dashed var(--rule);background:rgba(255,255,255,.35);
  padding:8px 12px;color:var(--ink-2);transition:all .12s;
}
.img-add:hover{background:rgba(255,255,255,.7);border-style:solid;border-color:var(--concrete)}
.img-hint{font-family:var(--form);font-size:10px;color:var(--ink-3);margin-top:6px;line-height:1.5}
.lightbox{
  position:fixed;inset:0;background:rgba(20,25,21,.92);z-index:150;
  display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;
}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border:1px solid var(--brass)}
.lightbox .lb-cap{
  position:absolute;bottom:14px;left:0;right:0;text-align:center;
  font-family:var(--form);font-size:11px;color:#b9c2b4;
}

.kind{
  font-family:var(--form);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  padding:2px 6px;margin-top:2px;white-space:nowrap;flex:0 0 auto;
  border:1px solid currentColor;
}
.k-faction{color:#4a3d6b}
.k-subfaction{color:#6b4a5f}
.k-unit{color:#2f5d4a}
.k-ability{color:#7a5a18}
.k-wargear{color:#5a5240}
.k-note{color:#6b6b6b}
.k-mechanic{color:#8d3527}
.k-rule{color:#3d5a6b}

.rowmain{flex:1;min-width:0}
.rowtitle{
  font-weight:600;font-size:15px;line-height:1.35;
  display:block;text-align:left;width:100%;
}
.rowtitle:hover{text-decoration:underline;text-underline-offset:2px}
.rowmeta{
  font-family:var(--form);font-size:10.5px;color:var(--ink-3);
  margin-top:3px;display:flex;gap:12px;flex-wrap:wrap;
}
.rowmeta .ref{color:var(--ink-2)}
.rowmeta .ann{color:var(--stamp)}

.status{
  font-family:var(--form);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;margin-top:2px;white-space:nowrap;flex:0 0 auto;
  border:1px solid;
}
.s-submitted{color:var(--ink-2);border-color:var(--rule);background:rgba(255,255,255,.4)}
.s-review{color:#7a5a18;border-color:#b39a4f;background:rgba(179,154,79,.12)}
.s-adopted{color:#2f5d4a;border-color:#2f5d4a;background:rgba(47,93,74,.1)}
.s-withdrawn{color:var(--ink-3);border-color:var(--rule);background:transparent;text-decoration:line-through}

.addkid{
  font-family:var(--form);font-size:16px;line-height:1;
  width:24px;height:24px;flex:0 0 24px;margin-top:0;
  border:1px solid var(--rule);background:rgba(255,255,255,.45);color:var(--ink-2);
  transition:all .12s;
}
.addkid:hover{background:var(--concrete);color:var(--paper);border-color:var(--concrete)}
.addkid.none{visibility:hidden}
.delkid{
  font-family:var(--form);font-size:12px;line-height:1;
  width:24px;height:24px;flex:0 0 24px;
  border:1px solid var(--rule);background:rgba(255,255,255,.45);color:var(--ink-3);
  transition:all .12s;
}
.delkid:hover{background:var(--stamp);color:var(--paper);border-color:var(--stamp)}

/* big add button */
.bigadd{
  width:100%;margin:22px 0 0;padding:22px;
  border:2px dashed var(--rule);background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;gap:14px;
  transition:background .14s,border-color .14s;
}
.bigadd:hover{background:rgba(255,255,255,.55);border-color:var(--concrete);border-style:solid}
.bigadd .plus{
  font-family:var(--disp);font-size:30px;line-height:.8;color:var(--stamp);
}
.bigadd .txt{font-family:var(--disp);font-size:15px;letter-spacing:.03em;text-transform:uppercase}
.bigadd .hint{font-family:var(--form);font-size:11px;color:var(--ink-3);display:block;margin-top:4px;text-transform:none;letter-spacing:0;font-weight:400}

.empty{
  border:1px solid var(--rule);background:rgba(255,255,255,.3);
  padding:34px 28px;margin-top:20px;text-align:center;
}
.empty h3{font-family:var(--disp);font-size:15px;text-transform:uppercase;letter-spacing:.02em}
.empty p{color:var(--ink-2);font-size:14px;margin-top:8px;max-width:46ch;margin-inline:auto}

/* ============ record panel ============ */
.record{
  position:sticky;top:0;align-self:start;
  border-left:1px solid var(--rule);
  background:var(--stock);
  min-height:100vh;padding:18px 0 40px 22px;
}
@media(max-width:1080px){
  .record{
    position:fixed;inset:0;z-index:60;border-left:0;padding:0;
    overflow-y:auto;display:none;
  }
  .record.open{display:block}
  .record-inner{padding:16px}
}
.record-inner{padding-right:2px}
.rec-close{display:none}
@media(max-width:1080px){
  .rec-close{
    display:block;width:100%;background:var(--concrete);color:var(--paper);
    font-family:var(--form);font-size:11px;letter-spacing:.1em;padding:12px;text-transform:uppercase;
  }
}
.rec-blank{
  font-family:var(--form);font-size:12px;color:var(--ink-3);
  border:1px dashed var(--rule);padding:26px 20px;text-align:center;line-height:1.7;
}
.rec-hd{
  border-bottom:2px solid var(--concrete);padding-bottom:9px;margin-bottom:14px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
}
.rec-ref{font-family:var(--form);font-size:11px;color:var(--ink-2);letter-spacing:.05em}
.rec-kind{font-family:var(--disp);font-size:16px;text-transform:uppercase;letter-spacing:.02em;margin-top:3px}
.rec-path{font-family:var(--form);font-size:10.5px;color:var(--ink-3);margin-top:5px;line-height:1.5}

.field{margin-bottom:13px}
.field > .flab{
  font-family:var(--form);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);display:block;margin-bottom:4px;
}
.field input[type=text],.field textarea,.field select{
  width:100%;background:rgba(255,255,255,.55);border:1px solid var(--rule);
  padding:8px 10px;font-size:14.5px;line-height:1.5;
}
.field input[type=text]:focus,.field textarea:focus,.field select:focus{
  outline:none;border-color:var(--focus);background:#fff;
  box-shadow:inset 0 0 0 1px var(--focus);
}
.field textarea{resize:vertical;min-height:110px;font-family:var(--body)}
.field .title-in{font-family:var(--disp);font-size:17px;padding:10px;letter-spacing:.01em}

.statusrow{display:flex;gap:0;border:1px solid var(--rule)}
.statusrow button{
  flex:1;font-family:var(--form);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  padding:8px 4px;border-right:1px solid var(--rule);background:rgba(255,255,255,.45);color:var(--ink-2);
}
.statusrow button:last-child{border-right:0}
.statusrow button:hover{background:rgba(255,255,255,.8)}
.statusrow button[aria-pressed="true"]{background:var(--concrete);color:var(--paper)}

.rec-foot{
  font-family:var(--form);font-size:10.5px;color:var(--ink-3);
  border-top:1px solid var(--rule);padding-top:9px;margin-top:4px;line-height:1.7;
}
.rec-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.act{
  font-family:var(--form);font-size:10.5px;letter-spacing:.05em;
  border:1px solid var(--rule);background:rgba(255,255,255,.45);
  padding:7px 11px;color:var(--ink-2);transition:all .12s;
}
.act:hover{background:var(--concrete);color:var(--paper);border-color:var(--concrete)}
.act.danger:hover{background:var(--stamp);border-color:var(--stamp)}

/* annotations */
.ann-hd{
  font-family:var(--disp);font-size:12px;text-transform:uppercase;letter-spacing:.03em;
  border-bottom:2px solid var(--concrete);padding-bottom:6px;margin:22px 0 12px;
  display:flex;justify-content:space-between;align-items:baseline;
}
.ann-hd span{font-family:var(--form);font-size:10.5px;color:var(--ink-3);letter-spacing:.05em}
.ann{
  border-left:3px solid var(--rule);padding:2px 0 2px 11px;margin-bottom:13px;
}
.ann.done{opacity:.5;border-left-color:#2f5d4a}
.ann-meta{
  font-family:var(--form);font-size:10.5px;color:var(--ink-2);
  display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:3px;
}
.ann-meta b{font-weight:700;color:var(--ink)}
.ann-body{font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.ann-ops{display:flex;gap:9px;margin-top:4px}
.ann-ops button{
  font-family:var(--form);font-size:10px;color:var(--ink-3);
  text-decoration:underline;text-underline-offset:2px;
}
.ann-ops button:hover{color:var(--stamp)}
.ann-new textarea{
  width:100%;min-height:66px;background:rgba(255,255,255,.55);
  border:1px solid var(--rule);padding:9px;font-family:var(--body);font-size:14px;resize:vertical;
}
.ann-new textarea:focus{outline:none;border-color:var(--focus);background:#fff;box-shadow:inset 0 0 0 1px var(--focus)}
.ann-new .go{
  margin-top:7px;font-family:var(--form);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--concrete);color:var(--paper);padding:9px 15px;transition:background .12s;
}
.ann-new .go:hover{background:var(--concrete-3)}

/* ============ modal ============ */
.veil{
  position:fixed;inset:0;background:rgba(33,42,35,.72);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal{
  background:var(--paper);border:1px solid var(--concrete-3);
  box-shadow:6px 6px 0 rgba(33,42,35,.35);
  width:min(560px,100%);max-height:88vh;overflow-y:auto;
}
.modal-hd{
  background:var(--concrete);color:var(--paper);padding:12px 18px;
  font-family:var(--disp);font-size:13px;text-transform:uppercase;letter-spacing:.04em;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.modal-hd button{font-family:var(--form);font-size:16px;color:#b9c2b4;line-height:1}
.modal-bd{padding:18px}
.modal-bd p{font-size:14px;color:var(--ink-2);margin-bottom:13px}
.modal-bd code{font-family:var(--form);font-size:12.5px;background:rgba(255,255,255,.5);padding:1px 4px;border:1px solid var(--rule)}
.modal-bd textarea{
  width:100%;min-height:150px;font-family:var(--form);font-size:12px;
  background:rgba(255,255,255,.55);border:1px solid var(--rule);padding:10px;resize:vertical;
}
.modal-bd textarea:focus{outline:none;border-color:var(--focus);background:#fff}
.modal-bd ol{margin:0 0 14px 18px;font-size:14px;color:var(--ink-2)}
.modal-bd ol li{margin-bottom:6px}
.modal-ft{display:flex;gap:9px;flex-wrap:wrap;padding:0 18px 18px}
.solid{
  font-family:var(--form);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  background:var(--concrete);color:var(--paper);padding:10px 16px;transition:background .12s;
}
.solid:hover{background:var(--concrete-3)}
.solid.red{background:var(--stamp)}
.solid.red:hover{background:#6f2a1f}
.ghost{
  font-family:var(--form);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  border:1px solid var(--rule);padding:10px 16px;color:var(--ink-2);
}
.ghost:hover{background:rgba(255,255,255,.6)}

.kindpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.kindpick button{
  border:1px solid var(--rule);background:rgba(255,255,255,.4);padding:11px 12px;text-align:left;
}
.kindpick button:hover{background:rgba(255,255,255,.8);border-color:var(--concrete)}
.kindpick b{font-family:var(--disp);font-size:12px;text-transform:uppercase;display:block;letter-spacing:.02em}
.kindpick small{font-family:var(--body);font-size:12px;color:var(--ink-3);display:block;margin-top:2px;line-height:1.4}

/* import staging */
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.maprow select,.bulkrow select{
  width:100%;background:rgba(255,255,255,.55);border:1px solid var(--rule);padding:7px 9px;font-size:13.5px;
}
.maprow select:focus,.bulkrow select:focus{outline:none;border-color:var(--focus);background:#fff}

<body>

<header class="masthead">
  <div class="mast-in">
