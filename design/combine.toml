# Combine Overwatch roster. Source of truth for unit names and string IDs.
#
# String IDs: a unit or doctrine with `ucs = N` uses N for its name and N+1 for its
# blurb. Keep entries on multiples of 10 inside `ucs_range` and never reuse a retired ID.
# Retired IDs stay in `retired_ucs` so the checker refuses to hand them out again.
#
# clone_from  vanilla unit whose blueprint we copy as the starting point
# vanilla_bp  attribute path of that blueprint. Fill in after extracting the
#             WW2 attribs with Corsix. Leave empty until checked in-game.
# status      planned | prototyped | in-game | final

[faction]
id = "combine"
name = "Combine Overwatch"
ucs = 32001000
blurb = "The occupying army of the Universal Union."
vanilla_race = "axis"
ucs_range = [32001000, 32001999]
retired_ucs = []

